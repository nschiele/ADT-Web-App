<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADT WebApp</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.5.0/lib/p5.js"></script>
  <script src="https://unpkg.com/flatted@3.2.7/min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.8.0/addons/p5.dom.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js"
    integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE"
    crossorigin="anonymous"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style/dashboard.css" rel="stylesheet">

  <link rel="icon" href="assets/images/logo.png" type="image/x-icon">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
</head>

<body id="capture">

  <header class="navbar-custom sticky-top  flex-md-nowrap p-0" id="topBar">
    <div class="px-3">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="index.html"
            class="d-inline-block d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
            <span id="navIconMain" data-feather="share-2" fill="#ffc107"
              class="bi d-inline-block mx-auto mb-1 mr-2"></span>
            <span id="navIcon">&nbsp;<span id="navText">ADT</span>app</span>
          </a>

          <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
            <li id="navLi">
              <a href="home.html" class="nav-link text-white ">
                <span class="bi d-block mx-auto mb-1">HOME</span>
              </a>
            </li>
            <li id="navLi">
              <a href="index.html" class="nav-link text-white active">
                <span class="bi d-block mx-auto mb-1">ADT</span>
              </a>
            </li>
            <li id="navLi">
              <a href="docs.html" target="_blank" class="nav-link text-white ">
                <span class="bi d-block mx-auto mb-1">DOCS</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="container-fluid adt-page">
    <div class="row" id="sideBarContainer">
      <main class="col-md-8 ms-sm-auto col-lg-9 px-md-3">
        <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          id="canvTopBar">
          <!-- <h1 class="h2">Untitled Tree</h1> -->
          <div class="col-auto">
            <!-- <label for="nodeTextLabel" class="visually-hidden">Text</label> -->
            <input type="text" class="form-control" placeholder="Untitled Tree" id="treeName" value="Untitled Tree">
          </div>
          <div id="btn-groupwarningIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="feather feather-alert-triangle">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
              </path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <div class="btn-toolbar mb-3 mb-md-0">
            <div class="btn-group me-1">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="autoFormatBtn" onclick="autoFormat()">
                Auto-format
              </button>
            </div>
            <div class="btn-group me-2">
              <!-- <div> -->
              <span data-bs-toggle="tooltip" data-bs-title="Upload">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="uploadBtn"
                  onclick="buildFromUpload()">
                  <span data-feather="upload" class="align-text-bottom"></span>
                </button>
                <!-- <ul class="dropdown-menu dropdown-menu-end">
                  <li><button class="dropdown-item" type="button" id="xmlBtn">xml</button></li>
 
                </ul> -->
              </span>
              <!-- </div> -->
              <!-- <div> -->
              <span data-bs-toggle="tooltip" data-bs-title="Download">
                <input type="file" id="ADTInput" accept=".xml, .json" style="display: none;">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="saveBtn" onclick="downloadPrep()">
                  <span data-feather="download" class="align-text-bottom"></span>
                </button>
                <!-- <select id="formatDropdown">
                  <option value="json">JSON</option>
                  <option value="xml">XML</option>
                </select> -->
                <!-- <ul class="dropdown-menu dropdown-menu-end">
                  <li><button class="dropdown-item" type="button" id="pngBtn">png</button></li>
                  <li><button class="dropdown-item" type="button" id="jpgBtn">jpg</button></li>
                </ul> -->
              </span>
              <span data-bs-toggle="tooltip" data-bs-title="AI">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="style" onclick="setAI()">
                  <span data-feather="cpu" class="align-text-bottom"></span>
                </button>
              </span>
              <span data-bs-toggle="tooltip" data-bs-title="Style">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="style" onclick="setStyle()">
                  <span data-feather="edit-3" class="align-text-bottom"></span>
                </button>
              </span>
                  <span data-bs-toggle="tooltip" data-bs-title="createFromXML">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="createFromXML" onclick="createFromXML()">
                  <span data-feather="plus-circle" class="align-text-bottom"></span>
                </button>
              </span>

              
              
              <span data-bs-toggle="tooltip" data-bs-title="saveScreenshot">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="saveScreenshot"
                  data-bs-toggle="dropdown" aria-expanded="false" onclick="saveScreenshotOLD()">
                  <span data-feather="camera" class="align-text-bottom"></span>
                </button>
              </span>
              <span data-bs-toggle="tooltip" data-bs-title="UploadToServer">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="UploadToServerBtn"
                  onclick="uploadToServer()">
                  <span data-feather="upload-cloud" class="align-text-bottom"></span>
                </button>
              </span>

              <span data-bs-toggle="tooltip" data-bs-title="RetrieveFromServer">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="RetrieveFromServerBtn"
                  onclick="retrieveFromServer()">
                  <span data-feather="download-cloud" class="align-text-bottom"></span>
                </button>
              </span>
              <!-- </div> -->
            </div>

            <div class="btn-group me-2">
              <span data-bs-toggle="tooltip" data-bs-title="Delete">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="deleteBtn" onclick="deleteTree()">
                  <span data-feather="trash" class="align-text-bottom"></span>
                </button>
              </span>
              <span data-bs-toggle="tooltip" data-bs-title="Reset">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshBtn" onClick="history.go(0);">
                  <span data-feather="refresh-cw" class="align-text-bottom"></span>
                </button>
              </span>
            </div>
            <div class="btn-group me-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="zoomOutBtn" onclick="zoomOut()">
                <span data-feather="minus" class="align-text-bottom"></span>
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="zoomInBtn" onclick="zoomIn()">
                <span data-feather="plus" class="align-text-bottom"></span>
              </button>
            </div>
          </div>
        </div>

        <!--CANVAS AREA-->
        <div class="row">
          <div id="canvasContainer" class="col-md-11">
            <!--canvas goes here-->
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="container-fluid text-center" id="botFooter">
    <p>&copy; 2023 . ADTapp . Leiden University</p>
  </footer>

  <div class="adtlangDiv">
    <div class="adtlangDivBody">
      <h1> ADTLang </h1>
      <button class="adtlangDivCloseButton">Close</button>
      <textarea class="adtlangDivInput" id="textAreaADTLang"></textarea>
      <button class="adtlangDivButton" id="generateTreeButton" onclick="generateTree()">Generate</button>
    </div>
  </div>
  <div class="aiDiv">
    <h1> AI Integration </h1>
    <p> </p>
    <div class="aiDivBody">
      <button class="aiDivCloseButton">Close</button>
      <h3>Put your Open AI Token below</h3>
      <p>This is only stored in the browser memory, if you reload the browser, you'll have to reenter the token.</p>
      <textarea class="aiDivInput" id="textAreaAI"></textarea>
      <button class="aiDivButton" id="saveAIButton" onclick="setAIKey()">Save AI Token</button>
    </div>
  </div>
  <div class="styleDiv">
    <h1> Set ADT Style </h1>
    <div class="styleDivBody">
      <button class="styleDivCloseButton">Close</button>
      <h3>Node Width</h3>
      <input type="range" id="widthrange" class="styleRange form-range" min="50" max="550" step="1" id="styleRange">
      <button class="styleDivButton" id="updateStyleButton" onclick="updateStyle()">Update Style</button>
    </div>
  </div>

  <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/style/dashboard.js"></script>
  <script src="script.js"></script>
  <script src="Tree.js"></script>
  <script src="Display.js"></script>
  <script src="json_func.js"></script>

  <script src="ADTLang/Compiler/bundle.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>



</body>


<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

</body>

</html>
