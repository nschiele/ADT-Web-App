<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ADT WebApp</title>

  <style>
    body { 
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"; 
      margin: 0; 
      padding: 0; 
      display: grid; 
      place-items: center; 
      min-height: 100vh; 
      background: #24034a; 
      color: #e2e8f0; 
    }

    .thediv { 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
      font-size: 1.25rem; 
      padding: .5rem .75rem; 
      background: #0b1020; 
      border: 1px solid rgba(255,255,255,.08); 
      border-radius: .5rem; 
      display: inline-block;
    }
  </style>
  </head>

  <body>
    <div id="thediv" class="thediv"></div>
    </div>
    
    <script>
    const epoch = Math.floor(Date.now());
    document.getElementById("thediv").textContent = `FLAG{P4thTr4v3rs4l_${epoch}}`;
  </script>
  </body>


</html>
