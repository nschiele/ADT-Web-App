<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ADT WebApp</title>

  <style>
    body { 
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"; 
      margin: 0; 
      padding: 0; 
      display: grid; 
      place-items: center; 
      min-height: 100vh; 
      background: #000000; 
      color: #e2e8f0; 
    }

    .thediv { 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
      font-size: 1.25rem; 
      padding: .5rem .75rem; 
      background: #6f7380; 
      border: 1px solid rgba(255,255,255,.08); 
      border-radius: .5rem; 
      display: inline-block;
    }
  </style>
  </head>

  <body>
    <div id="thediv" class="thediv"></div>
    </div>
<body>

<script type="text/javascript">
(function() {
  if (typeof window === "undefined" || window.location.pathname.endsWith("fl_ag.html")) {
    const chars = [70, 76, 65, 71]; 
    const epoch = Math.floor(Date.now());
    const f = String.fromCharCode(...chars) + `{Th3N3tw0rkT4b_${epoch}}`;
    document.getElementById("thediv").textContent = f;
  }
})();

</script>
</html>
